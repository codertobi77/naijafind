name: Build and Push (GHCR)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: | 
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VITE_CONVEX_URL=${{ secrets.VITE_CONVEX_URL }}
            VITE_CONVEX_SITE_URL=${{ secrets.VITE_CONVEX_SITE_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

  # Déploiement sur le VPS Hostinger : tire l'image fraîchement publiée sur
  # GHCR et redémarre le conteneur via docker compose. Rétablit la connexion
  # CI -> VPS coupée le 2026-02-26 (remplacement de l'ancien deploy.yml).
  deploy-vps:
    name: Deploy to Hostinger VPS
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/var/www/suji' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Verify VPS secrets and configure SSH
        run: |
          if [ -z "$VPS_HOST" ]; then echo "❌ VPS_HOST secret manquant"; exit 1; fi
          if [ -z "$VPS_USER" ]; then echo "❌ VPS_USER secret manquant"; exit 1; fi
          if [ -z "$VPS_DEPLOY_PATH" ]; then echo "❌ VPS_DEPLOY_PATH secret manquant"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          echo "✓ SSH configuré pour $VPS_USER@$VPS_HOST:$VPS_SSH_PORT"

      - name: Copy docker-compose.yml to VPS
        run: |
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH'"
          scp -P "$VPS_SSH_PORT" docker-compose.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          echo "✓ docker-compose.yml copié dans $VPS_DEPLOY_PATH"

      - name: Pull image and restart container
        # Heredoc non coté : les $VPS_* s'étendent côté runner avant l'envoi SSH
        # (les variables internes du script distant sont échappées : \$ok, \$i)
        run: |
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" bash << EOF
            set -e
            cd "$VPS_DEPLOY_PATH"
            echo "→ Pull de l'image ghcr.io/codertobi77/naijafind:latest…"
            docker compose pull
            echo "→ Redémarrage du conteneur…"
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null 2>&1 || true
            echo "== Diagnostics conteneur =="
            docker ps --format '{{.Names}} | {{.Status}} | {{.Ports}}'
            echo "== Attente de l'application (https://suji.ng) =="
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 https://suji.ng/ >/dev/null 2>&1; then ok=1; break; fi
              sleep 10
            done
            if [ "\$ok" = "1" ]; then
              echo "✓ https://suji.ng répond après relance"
            else
              echo "❌ https://suji.ng ne répond pas — diagnostics :"
              echo "-- conf nginx (proxy_pass/listen) --"
              grep -rhE 'proxy_pass|listen' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || echo "(conf nginx illisible)"
              echo "-- ports en écoute --"
              (ss -tln 2>/dev/null || netstat -tln 2>/dev/null || true) | grep -E ':(80|443|3000|3333|3555)\b' || echo "(aucun des ports attendus en écoute)"
              echo "-- logs suji-app --"
              docker logs suji-app --tail 30 2>&1 || true
              exit 1
            fi
          EOF
