services:
  suji:
    # Image publiée sur GHCR par le workflow GitHub Actions
    # (.github/workflows/docker-ghcr.yml). Le VPS Hostinger la tire via
    # `docker compose pull` (image publique : aucun docker login requis).
    image: ghcr.io/codertobi77/naijafind:latest
    container_name: suji-app
    restart: unless-stopped
    ports:
      # Deux ports hôtes vers le nginx interne du conteneur :
      # - 3555 : port historique du conteneur précédent, attendu par le
      #   proxy_pass de la conf nginx du VPS (vérifié par scan avant/après)
      # - 3333 : défaut documenté (DEPLOYMENT.md)
      - "3555:80"
      - "3333:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - suji-network

networks:
  suji-network:
    driver: bridge
